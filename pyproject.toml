[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hnsw-lite"
version = "0.1.0"
description = "A from-scratch HNSW approximate nearest-neighbor index in Python + NumPy, with benchmarks against exact search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
bench = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["hnswlite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
